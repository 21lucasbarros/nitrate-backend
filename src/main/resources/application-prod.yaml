# Perfil de produção (ativado no Docker com SPRING_PROFILES_ACTIVE=prod).
# Não tem nenhum segredo: tudo vem de variáveis de ambiente configuradas no host.
spring:
  application:
    name: nitrate

  # virtual threads (Java 21): requisições esperando o banco ou o TMDB não ocupam threads do sistema
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL}          # ex.: jdbc:postgresql://HOST.neon.tech/neondb?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # foto de perfil: o front já manda reduzida, mas o app/celular pode enviar a original
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # carrega gêneros/diretor/franquia/elenco em lotes, e não uma consulta por filme (N+1)
        default_batch_fetch_size: 50

server:
  port: ${PORT:8080}              # Render/Railway/Fly informam a porta por PORT

tmdb:
  api-key: ${TMDB_API_KEY}
  base-url: https://api.themoviedb.org/3

jwt:
  secret: ${JWT_SECRET}           # mínimo de 32 caracteres (HMAC-SHA256)
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}   # ex.: https://nitrate.com.br

admin:
  secret: ${CRON_SECRET}          # protege /admin/**; enviado pelas tarefas agendadas
  emails: ${ADMIN_EMAILS:}        # contas que abrem o painel de admin no site, separadas por vírgula
  usernames: ${ADMIN_USERNAMES:21lucasbarros}  # idem, pelo @

# e-mails (redefinição de senha) pelo Resend. EMAIL_FROM precisa ser de um domínio verificado
# no Resend, ex.: "Nitrate <nao-responda@seudominio.com>"
resend:
  api-key: ${RESEND_API_KEY}
email:
  from: ${EMAIL_FROM}

app:
  frontend-url: ${FRONTEND_URL}   # ex.: https://nitrate.com.br (vai no link do e-mail)
