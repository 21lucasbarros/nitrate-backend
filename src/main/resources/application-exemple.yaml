# Copie para application.yaml (ignorado pelo git) e preencha com seus dados locais.
# Em produção (Docker) a configuração vem do application-prod.yaml + variáveis de ambiente.
spring:
  application:
    name: nitrate

  datasource:
    url: jdbc:postgresql://SEU-HOST.neon.tech/SEU_BANCO?sslmode=require
    username: SEU_USUARIO
    password: SUA_SENHA

  # foto de perfil: o front já manda reduzida, mas o app/celular pode enviar a original
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50   # evita N+1 ao listar filmes/reviews

tmdb:
  api-key: ${TMDB_API_KEY}
  base-url: https://api.themoviedb.org/3

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# segredo do /admin/** (sem ele, o /admin fica bloqueado). Chame com:
#   curl -H "Authorization: Bearer SEU_SEGREDO" -X POST localhost:8080/admin/expand-graph
admin:
  secret: ${CRON_SECRET:troque-este-segredo-local}

