# Copie para application.yaml (ignorado pelo git) e preencha com seus dados locais.
# Em produção (Docker) a configuração vem do application-prod.yaml + variáveis de ambiente.
spring:
  application:
    name: nitrate

  datasource:
    url: jdbc:postgresql://SEU-HOST.neon.tech/SEU_BANCO?sslmode=require
    username: SEU_USUARIO
    password: SUA_SENHA

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

tmdb:
  api-key: ${TMDB_API_KEY}
  base-url: https://api.themoviedb.org/3

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# segredo do /admin/** (sem ele, o /admin fica bloqueado). Chame com:
#   curl -H "Authorization: Bearer SEU_SEGREDO" -X POST localhost:8080/admin/expand-graph
admin:
  secret: ${CRON_SECRET:troque-este-segredo-local}

# opcional: padrão é http://localhost:3000
# cors:
#   allowed-origins: http://localhost:3000
